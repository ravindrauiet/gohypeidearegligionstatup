<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CosmicGuide Dashboard</title>
<style>
  :root {
    --bg: #f6f5f9; --card: #ffffff; --text: #1d1b26; --muted: #6b6878; --line: #e4e1ec;
    --accent: #5b3fd1; --web: #5b3fd1; --app: #e8710a; --cost: #1f7a4d; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14121b; --card: #1e1b28; --text: #ece9f5; --muted: #a09cb0; --line: #312d40;
      --accent: #9d87ff; --web: #9d87ff; --app: #f5a25d; --cost: #5fd39a; --bad: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 17px; margin: 0; }
  main { max-width: 1150px; margin: 0 auto; padding: 16px; }
  section { margin-bottom: 26px; }
  h2 { font-size: 15px; margin: 0 0 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .stat .n { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 13px; }
  .stat .s { color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button, input, select { font: inherit; }
  button, a.btn { border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 6px 12px; border-radius: 7px; cursor: pointer; text-decoration: none; font-size: 14px; }
  button:hover, a.btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=password], input[type=search], select { border: 1px solid var(--line); background: var(--bg);
    color: var(--text); padding: 6px 10px; border-radius: 7px; }
  .login { max-width: 380px; margin: 60px auto; display: grid; gap: 10px; }
  .msg { margin: 8px 0; font-size: 14px; } .msg.err { color: var(--bad); } .msg.info { color: var(--muted); }
  .muted { color: var(--muted); font-size: 13px; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); font-weight: 400; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .chart svg { width: 100%; height: 190px; display: block; }
  .chart .axis { fill: var(--muted); font-size: 10px; }
  .chart .gridline { stroke: var(--line); stroke-width: 1; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
  td .sub { color: var(--muted); font-size: 12px; }
  .pill { display: inline-block; padding: 0 7px; border-radius: 99px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 400; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>CosmicGuide Dashboard</h1>
  <div class="actions">
    <select id="days" aria-label="Date range" hidden>
      <option value="1">Today</option>
      <option value="7">Last 7 days</option>
      <option value="30" selected>Last 30 days</option>
      <option value="90">Last 90 days</option>
      <option value="365">Last 365 days</option>
    </select>
    <a class="btn" href="/admin">Moderation</a>
    <button id="refresh" hidden>Refresh</button>
    <button id="logout" hidden>Sign out</button>
  </div>
</header>

<main>
  <form id="login" class="card login" hidden>
    <label for="key" style="font-weight:600">Admin key</label>
    <input id="key" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Open dashboard</button>
    <div id="loginMsg" class="msg err"></div>
  </form>

  <div id="app" hidden>
    <div id="msg" class="msg"></div>

    <section>
      <h2>Users</h2>
      <div id="userStats" class="stats"></div>
    </section>

    <section>
      <h2>AI usage &amp; spend <span class="muted" id="rateNote"></span></h2>
      <div id="aiStats" class="stats"></div>
    </section>

    <section class="grid2">
      <div class="card chart">
        <h2>Daily active users <span class="legend"><span><i style="background:var(--web)"></i>Web</span><span><i style="background:var(--app)"></i>App</span></span></h2>
        <div id="chartActive"></div>
      </div>
      <div class="card chart">
        <h2>Daily AI spend <span class="legend"><span><i style="background:var(--cost)"></i>₹ estimated</span></span></h2>
        <div id="chartCost"></div>
      </div>
    </section>

    <section class="grid2">
      <div class="card">
        <h2>Platforms</h2>
        <div class="tablewrap"><table id="platforms"></table></div>
      </div>
      <div class="card">
        <h2>AI by feature</h2>
        <div class="tablewrap"><table id="features"></table></div>
      </div>
    </section>

    <section class="card">
      <h2>Users &amp; their AI usage
        <span class="filters">
          <input id="q" type="search" placeholder="Search name or email" aria-label="Search users">
          <select id="sort" aria-label="Sort users">
            <option value="cost">Most AI spend</option>
            <option value="active">Recently active</option>
            <option value="recent">Newest sign-ups</option>
          </select>
          <label><input id="guests" type="checkbox"> Include guests</label>
        </span>
      </h2>
      <div class="tablewrap"><table id="users"></table></div>
      <div class="muted" style="margin-top:8px">Shows up to 100 users. AI numbers and active days cover the selected date range.</div>
    </section>
  </div>
</main>

<script>
(function () {
  'use strict';
  var KEY_STORE = 'cg_admin_key'; // same key as the moderation page, so one sign-in covers both
  var SVG = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  var memKey = '';
  var rate = 88;

  function getKey() { try { return sessionStorage.getItem(KEY_STORE) || memKey; } catch (_) { return memKey; } }
  function setKey(k) { memKey = k; try { k ? sessionStorage.setItem(KEY_STORE, k) : sessionStorage.removeItem(KEY_STORE); } catch (_) {} }

  // textContent only, so names/emails can never inject HTML.
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c !== null && c !== undefined) n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c))); });
    return n;
  }
  function svg(tag, attrs) {
    var n = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }

  function api(path) {
    return fetch('/api/admin' + path, { headers: { 'x-admin-key': getKey() }, cache: 'no-store' })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (json) {
          if (res.status === 401 || res.status === 503) {
            showLogin(res.status === 503 ? 'Admin is disabled on the server (set ADMIN_KEY).' : 'Wrong admin key.');
            throw new Error('auth');
          }
          if (!res.ok) throw new Error(json.error || ('Request failed (' + res.status + ')'));
          return json;
        });
      });
  }

  function say(text, isError) { var m = $('msg'); m.textContent = text || ''; m.className = 'msg ' + (isError ? 'err' : 'info'); }
  function fmtNum(n) { return Number(n || 0).toLocaleString('en-IN'); }
  function fmtCompact(n) {
    n = Number(n || 0);
    if (n >= 1e7) return (n / 1e7).toFixed(1) + ' Cr';
    if (n >= 1e5) return (n / 1e5).toFixed(1) + ' L';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(Math.round(n));
  }
  function inr(usd) {
    var v = Number(usd || 0) * rate;
    return '₹' + v.toLocaleString('en-IN', { minimumFractionDigits: v < 100 ? 2 : 0, maximumFractionDigits: v < 100 ? 2 : 0 });
  }
  function usd(v) { v = Number(v || 0); return '$' + v.toFixed(v < 1 ? 4 : 2); }
  function ago(s) {
    if (!s) return '—';
    var d = new Date(s); if (isNaN(d)) return String(s);
    var m = Math.round((Date.now() - d.getTime()) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    if (m < 1440) return Math.round(m / 60) + ' h ago';
    if (m < 43200) return Math.round(m / 1440) + ' d ago';
    return d.toLocaleDateString();
  }
  function rangeLabel() { var o = $('days').selectedOptions[0]; return o ? o.textContent.toLowerCase() : ''; }

  function stat(label, value, sub) {
    return el('div', { class: 'card stat' }, [el('div', { class: 'n', text: value }), el('div', { class: 'l', text: label }), sub ? el('div', { class: 's', text: sub }) : null]);
  }
  function fill(id, nodes) { var n = $(id); n.textContent = ''; nodes.forEach(function (c) { n.appendChild(c); }); }

  // Bar chart: series = [{key, color}], stacked. rows = daily objects. fmt formats axis/tooltip values.
  function barChart(id, rows, series, fmt, scale) {
    var box = $(id); box.textContent = '';
    var W = 600, H = 190, L = 44, B = 22, T = 8, R = 6;
    var vals = rows.map(function (r) { return series.reduce(function (s, x) { return s + Number(r[x.key] || 0) * (scale || 1); }, 0); });
    var max = Math.max.apply(null, vals.concat([0]));
    if (max <= 0) { box.appendChild(el('div', { class: 'empty', text: 'No data in this range yet.' })); return; }
    var nice = niceMax(max);
    var s = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none', role: 'img' });
    for (var g = 0; g <= 4; g++) {
      var y = T + (H - T - B) * (1 - g / 4);
      s.appendChild(svg('line', { x1: L, x2: W - R, y1: y, y2: y, class: 'gridline' }));
      var t = svg('text', { x: L - 6, y: y + 3, 'text-anchor': 'end', class: 'axis' }); t.textContent = fmt(nice * g / 4, true); s.appendChild(t);
    }
    var n = rows.length, slot = (W - L - R) / n, bw = Math.max(1, Math.min(28, slot * 0.7));
    rows.forEach(function (r, i) {
      var x = L + slot * i + (slot - bw) / 2, base = H - B;
      var tip = r.day + ': ' + series.map(function (sr) { return sr.label + ' ' + fmt(Number(r[sr.key] || 0) * (scale || 1)); }).join(', ');
      series.forEach(function (sr) {
        var v = Number(r[sr.key] || 0) * (scale || 1); if (v <= 0) return;
        var h = (H - T - B) * v / nice;
        var rect = svg('rect', { x: x, y: base - h, width: bw, height: h, style: 'fill:' + sr.color, rx: 2 });
        var title = svg('title', {}); title.textContent = tip; rect.appendChild(title);
        s.appendChild(rect); base -= h;
      });
      var every = Math.ceil(n / 7);
      if (i % every === 0 || i === n - 1) {
        var lab = svg('text', { x: x + bw / 2, y: H - 6, 'text-anchor': 'middle', class: 'axis' });
        lab.textContent = r.day.slice(5); s.appendChild(lab);
      }
    });
    box.appendChild(s);
  }
  function niceMax(v) {
    var p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
  }

  function table(id, head, rows, emptyText) {
    var t = $(id); t.textContent = '';
    t.appendChild(el('thead', null, [el('tr', null, head.map(function (h) { return el('th', { class: h.r ? 'r' : '', text: h.t }); }))]));
    var body = el('tbody');
    if (!rows.length) body.appendChild(el('tr', null, [el('td', { colspan: String(head.length), class: 'empty', text: emptyText })]));
    rows.forEach(function (cells) {
      body.appendChild(el('tr', null, cells.map(function (c, i) {
        var td = el('td', { class: head[i].r ? 'r' : '' });
        if (c && typeof c === 'object' && c.nodeType) td.appendChild(c); else td.textContent = c === null || c === undefined ? '—' : String(c);
        return td;
      })));
    });
    t.appendChild(body);
  }

  var PLATFORM_NAMES = { web: 'Web (Chrome etc.)', android: 'Android app', ios: 'iOS app', app: 'App (older version)', other: 'Other' };

  function loadOverview() {
    return api('/analytics?days=' + $('days').value).then(function (d) {
      rate = d.usdToInr || rate;
      var r = rangeLabel(), u = d.users, a = d.ai;
      $('rateNote').textContent = '(₹ at ' + rate + ' per $1, estimated from OpenAI token prices)';
      fill('userStats', [
        stat('Active today', fmtNum(u.activeToday), 'people who used the app or site'),
        stat('Active, ' + r, fmtNum(u.activeInRange), 'unique people'),
        stat('Registered users', fmtNum(u.total), fmtNum(u.guests) + ' guest accounts'),
        stat('New sign-ups today', fmtNum(u.signupsToday), fmtNum(u.signupsInRange) + ' ' + r),
      ]);
      fill('aiStats', [
        stat('AI spend today', inr(a.today.costUsd), usd(a.today.costUsd) + ' · ' + fmtNum(a.today.calls) + ' calls'),
        stat('AI spend, ' + r, inr(a.inRange.costUsd), usd(a.inRange.costUsd) + ' · ' + fmtNum(a.inRange.users) + ' users'),
        stat('Tokens, ' + r, fmtCompact(a.inRange.tokens), fmtNum(a.inRange.calls) + ' AI calls'),
        stat('AI spend, all time', inr(a.allTime.costUsd), fmtCompact(a.allTime.tokens) + ' tokens'),
      ]);
      barChart('chartActive', d.daily,
        [{ key: 'web', color: 'var(--web)', label: 'Web' }, { key: 'app', color: 'var(--app)', label: 'App' }],
        function (v) { return fmtCompact(v); });
      barChart('chartCost', d.daily, [{ key: 'aiCostUsd', color: 'var(--cost)', label: 'Spend' }],
        function (v, axis) { return axis ? '₹' + fmtCompact(v) : '₹' + Number(v).toFixed(2); }, rate);
      table('platforms', [{ t: 'Platform' }, { t: 'Today', r: 1 }, { t: r.charAt(0).toUpperCase() + r.slice(1), r: 1 }, { t: 'App opens', r: 1 }],
        d.platforms.map(function (p) { return [PLATFORM_NAMES[p.platform] || p.platform, fmtNum(p.activeToday), fmtNum(p.activeInRange), fmtNum(p.opens)]; }),
        'No visits recorded in this range yet.');
      table('features', [{ t: 'Feature' }, { t: 'Model' }, { t: 'Calls', r: 1 }, { t: 'Tokens', r: 1 }, { t: 'Spend', r: 1 }],
        d.features.map(function (f) { return [f.feature, f.model, fmtNum(f.calls), fmtCompact(f.tokens), inr(f.costUsd)]; }),
        'No AI calls in this range yet.');
    });
  }

  function loadUsers() {
    var qs = '?days=' + $('days').value + '&sort=' + $('sort').value + '&q=' + encodeURIComponent($('q').value.trim()) + ($('guests').checked ? '&guests=1' : '');
    return api('/analytics/users' + qs).then(function (d) {
      table('users',
        [{ t: 'User' }, { t: 'Platforms' }, { t: 'Active days', r: 1 }, { t: 'Last seen' }, { t: 'AI calls', r: 1 }, { t: 'Tokens', r: 1 }, { t: 'AI spend', r: 1 }, { t: 'Joined' }],
        d.users.map(function (u) {
          var who = el('div', null, [
            el('div', null, [(u.name || 'User') + ' ', el('span', { class: 'pill', text: '#' + u.id + (u.role !== 'user' ? ' · ' + u.role : '') })]),
            u.email ? el('div', { class: 'sub', text: u.email }) : null,
          ]);
          return [who, u.platforms, fmtNum(u.activeDays), ago(u.lastSeen), fmtNum(u.aiCalls), fmtCompact(u.aiTokens), inr(u.aiCostUsd), u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '—'];
        }),
        'No users match.');
    });
  }

  function loadAll() {
    say('Loading…');
    return Promise.all([loadOverview(), loadUsers()])
      .then(function () { say('Updated ' + new Date().toLocaleTimeString()); })
      .catch(function (e) { if (e.message !== 'auth') say(e.message, true); });
  }

  function showLogin(message) {
    setKey('');
    ['app', 'refresh', 'logout', 'days'].forEach(function (id) { $(id).hidden = true; });
    $('login').hidden = false; $('loginMsg').textContent = message || ''; $('key').value = ''; $('key').focus();
  }
  function showApp() {
    $('login').hidden = true;
    ['app', 'refresh', 'logout', 'days'].forEach(function (id) { $(id).hidden = false; });
    loadAll();
  }

  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    var k = $('key').value.trim(); if (!k) return;
    setKey(k); showApp();
  });
  $('logout').addEventListener('click', function () { showLogin(''); });
  $('refresh').addEventListener('click', loadAll);
  $('days').addEventListener('change', loadAll);
  $('sort').addEventListener('change', function () { loadUsers().catch(function (e) { if (e.message !== 'auth') say(e.message, true); }); });
  $('guests').addEventListener('change', function () { loadUsers().catch(function (e) { if (e.message !== 'auth') say(e.message, true); }); });
  var timer = null;
  $('q').addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () { loadUsers().catch(function (e) { if (e.message !== 'auth') say(e.message, true); }); }, 350);
  });

  if (getKey()) showApp(); else showLogin('');
})();
</script>
</body>
</html>
