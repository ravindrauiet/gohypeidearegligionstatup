name: pujakaro
description: "AI Astrology & Kundli Application powered by Neon DB"
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  
  # State Management
  provider: ^6.1.1
  
  # UI Components & Animations
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  fluttertoast: ^8.2.4
  intl: ^0.19.0
  
  # Local Storage & HTTP Networking
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  http: ^1.1.0
  dio: ^5.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/cosmicguide_icon.png"
  adaptive_icon_background: "#121026"
  adaptive_icon_foreground: "assets/icons/cosmicguide_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
